<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="60%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Vibrant Green Accent Gradient -->
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>

    <!-- Cyan Accent for Beats -->
    <linearGradient id="cyanAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Icon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#22c55e" flood-opacity="0.45" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#06b6d4" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Subtle Neon Rim -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#neonGreen)" stroke-width="6" stroke-opacity="0.4" />

  <!-- Outer Soundwaves / Disc Rings (Subtle) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#374151" stroke-width="3" stroke-dasharray="8 12" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#22c55e" stroke-width="2" stroke-opacity="0.2" />

  <!-- Main Musical Icon: Modern Double Eighth Note with Glow -->
  <g filter="url(#glow)">
    <!-- Connecting Top Beam -->
    <path d="M196 148 L356 112 C366 110 376 117 376 128 L376 178 C376 188 368 196 358 198 L198 234 C188 236 178 229 178 218 L178 168 C178 158 186 150 196 148 Z" fill="url(#neonGreen)" />
    
    <!-- Left Stem -->
    <rect x="178" y="160" width="28" height="190" rx="6" fill="url(#neonGreen)" />
    
    <!-- Right Stem -->
    <rect x="348" y="124" width="28" height="190" rx="6" fill="url(#neonGreen)" />

    <!-- Left Note Head (Angled Oval) -->
    <ellipse cx="152" cy="346" rx="46" ry="34" transform="rotate(-25 152 346)" fill="url(#cyanAccent)" />
    
    <!-- Right Note Head (Angled Oval) -->
    <ellipse cx="322" cy="310" rx="46" ry="34" transform="rotate(-25 322 310)" fill="url(#cyanAccent)" />
  </g>

  <!-- Modern Dynamic Equalizer Bars at the Bottom (Pulse Effect) -->
  <g filter="url(#subtleGlow)">
    <rect x="190" y="408" width="16" height="32" rx="8" fill="url(#neonGreen)" />
    <rect x="218" y="394" width="16" height="46" rx="8" fill="url(#cyanAccent)" />
    <rect x="248" y="380" width="16" height="60" rx="8" fill="url(#neonGreen)" />
    <rect x="278" y="390" width="16" height="50" rx="8" fill="url(#cyanAccent)" />
    <rect x="306" y="404" width="16" height="36" rx="8" fill="url(#neonGreen)" />
  </g>

  <!-- Sparkle Accent in Upper Right -->
  <path d="M400 90 Q400 115 425 115 Q400 115 400 140 Q400 115 375 115 Q400 115 400 90 Z" fill="#4ade80" opacity="0.8" />
</svg>
